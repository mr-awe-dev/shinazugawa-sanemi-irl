<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ebedf3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Terapkan tema sebelum paint pertama supaya tidak ada kedipan warna.
      // Mode "system" ikut prefers-color-scheme OS; nilai ini yang dibaca ulang
      // oleh src/lib/theme.ts saat app mount.
      ;(function () {
        try {
          var saved = localStorage.getItem('sanemi-theme-v1')
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Sanemi IRL Tracker</title>
    <meta
      name="description"
      content="PWA latihan harian ala Shinazugawa Sanemi: checklist protein, hidrasi, langkah, tidur, sesi latihan, jadwal shift, plus rekap mingguan dan bulanan."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
